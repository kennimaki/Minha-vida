<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3ef">
<title>Sala de Dispositivos</title>
<style>
:root{
  --bg:#f2f3ef;--surface:#fff;--ink:#1d2421;--muted:#65706a;--line:#d6dbd4;--grid:#e3e7e1;
  --acc:#2f6b55;--acc-ink:#fff;--focus:#1f5fbf;
  --warn:#b45f00;--warn-bg:#ffedd5;--late:#c22727;--late-bg:#fde4e4;--okc:#2e7d4f;
  --shadow:0 10px 30px rgba(20,30,25,.20),0 2px 6px rgba(20,30,25,.10);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Cabeçalho */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 10px;display:flex;flex-direction:column;gap:6px}
header .top{display:flex;align-items:center;gap:8px 14px;min-height:36px;flex-wrap:wrap}
header .top .status{margin-left:auto}
#roomName{font-size:18px;font-weight:650;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin-left:-6px;background:transparent;min-width:0;width:min(320px,100%)}
#roomName:hover{border-color:var(--line)}
#roomName:focus{border-color:var(--acc);outline:none;background:#fff}
.summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px}
.pill.late{color:var(--late);border-color:#f0b4b4;background:var(--late-bg);font-weight:600}
.pill.soon{color:var(--warn);border-color:#f3c98f;background:var(--warn-bg);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.searchbox{position:relative;display:flex;align-items:center}
#q{border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 10px;width:250px;background:#fff}
#q:focus{border-color:var(--acc);outline:none}
#qclear{position:absolute;right:4px;border:0;background:transparent;font-size:16px;color:var(--muted);width:24px;height:24px;border-radius:4px}
#qcount{font-size:12.5px;color:var(--muted);min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;white-space:nowrap}
.btn:hover{background:#f6f7f4;border-color:#c3c9c1}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:#265a47}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--late);font-weight:600}
.bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:thin}
.tab{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 12px;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab:hover{background:#f1f3ef;color:var(--ink)}
.tab[aria-selected="true"]{background:#e6efe9;border-color:#bcd3c5;color:var(--acc);font-weight:650}
.tab.add{color:var(--acc);border:1px dashed #b7c9bd}
.tab .n{font-size:11.5px;background:#eef0ec;color:var(--muted);border-radius:999px;padding:0 7px;font-weight:600}
.tab .hitn{background:#dbe6f7;color:var(--focus)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.late{background:var(--late)} .dot.soon{background:var(--warn)}
.sizectl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sizectl .lbl{font-size:12.5px;color:var(--muted);margin-left:6px}
.sizectl output{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sb{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:17px;line-height:1;padding:0}
.sb:hover{background:#f1f3ef}
.sb:disabled{opacity:.4;cursor:default}
.btn.small{padding:5px 10px;font-size:12.5px;margin-left:8px}
#bDelSala{color:var(--late)}
.hint{padding:6px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:#f8f9f6}

/* Mapa */
#map{flex:1;overflow:auto;padding:24px 32px 32px 24px;position:relative;-webkit-overflow-scrolling:touch}
body.sheet-open #map{padding-bottom:75vh}
#room{position:relative;margin:0 auto;background-color:#fff;border:1px solid #c9cfc7;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  box-shadow:0 1px 2px rgba(0,0,0,.05);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#eqs{position:absolute;inset:0}
.eq{position:absolute;border-radius:6px;border:1.5px solid var(--bd);background:var(--fill);padding:3px 6px;overflow:hidden;cursor:grab;
  touch-action:pan-x pan-y;font-size:12px;line-height:15px;transition:opacity .12s,box-shadow .12s}
.eq:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.eq .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .code{font-weight:650;font-size:12.5px;padding-right:8px}
.eq .code .none{font-weight:400;color:var(--muted);font-style:italic}
.eq .desc{color:#36403b}
.eq .it{color:#4f5a54;font-size:11.5px}
.eq .more{color:var(--muted);font-size:11px}
.w{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;font-weight:650;line-height:15px}
.w.soon,.w.today{background:var(--warn-bg);color:var(--warn)}
.w.late{background:var(--late-bg);color:var(--late)}
.flag{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff}
.flag.soon,.flag.today{background:var(--warn)} .flag.late{background:var(--late)}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 55%,var(--bd) 55%,var(--bd) 65%,transparent 65%,transparent 75%,var(--bd) 75%,var(--bd) 85%,transparent 85%)}
.eq.dim{opacity:.22}
.eq.hit{box-shadow:0 0 0 3px var(--focus)}
.eq.sel{box-shadow:0 0 0 2px var(--ink)}
.eq.dragging{opacity:.35}
.eq.flash{animation:flash .9s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--focus)}}
#ghost,#hover{position:absolute;border-radius:6px;pointer-events:none;display:none}
#ghost{border:2px dashed var(--acc);background:rgba(47,107,85,.12)}
#ghost.swap{border-color:var(--focus);background:rgba(31,95,191,.12)}
#ghost.bad{border-color:var(--late);background:rgba(194,39,39,.10)}
#hover{border:1.5px dashed #9aa59d;color:#7d8881;align-items:center;justify-content:center;font-size:20px;font-weight:300}
.edge{position:absolute;touch-action:none;z-index:2}
.edge.r{top:0;right:-14px;width:12px;height:100%;cursor:ew-resize}
.edge.b{left:0;bottom:-14px;height:12px;width:100%;cursor:ns-resize}
.edge.c{right:-16px;bottom:-16px;width:18px;height:18px;cursor:nwse-resize}
.edge::after{content:"";position:absolute;background:#c3cac2;border-radius:3px;transition:background .15s}
.edge.r::after{left:4px;top:50%;width:4px;height:36px;margin-top:-18px}
.edge.b::after{top:4px;left:50%;height:4px;width:36px;margin-left:-18px}
.edge.c::after{inset:4px;border-radius:50%}
.edge:hover::after,.edge.on::after{background:var(--acc)}
#sizeTag{position:absolute;right:0;bottom:-38px;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px;display:none;white-space:nowrap}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none;padding:16px;font-size:15px}

/* Painel */
#panel{position:fixed;z-index:20;width:430px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column}
#panel[hidden]{display:none}
#phead{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);cursor:move;touch-action:none;user-select:none}
#ptitle{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pclose{border:0;background:transparent;font-size:22px;line-height:1;width:32px;height:32px;border-radius:6px;color:var(--muted)}
#pclose:hover{background:#eef0ec;color:var(--ink)}
#pbody{overflow:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.f{display:flex;flex-direction:column;gap:3px}
.f>span,.mini>span{font-size:12px;color:var(--muted);font-weight:550}
.f input,.f textarea,.mini input,.mini select,.f select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;width:100%;min-width:0}
.f input:focus,.f textarea:focus,.mini input:focus,.mini select:focus,.f select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px rgba(47,107,85,.15)}
.f textarea{resize:vertical;min-height:58px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fafbf9}
.box h3{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.box h3 small{font-weight:400;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:flex;flex-direction:column;gap:2px;min-width:0}
.item{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
.ih{display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.ih .rm{width:28px;height:28px}
.cal3{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;align-items:end}
.venc{display:block;border:1px dashed var(--line);border-radius:7px;padding:6px 8px;font-weight:650;font-variant-numeric:tabular-nums;background:#f6f7f4;white-space:nowrap}
.mini input.miss{border-color:#e7b77a;background:#fffaf2}
.st.miss{color:var(--warn)}
.rmtxt{align-self:flex-end;border:0;background:transparent;color:var(--late);font-size:12.5px;padding:2px 0}
.rmtxt:hover{text-decoration:underline}
.dots{border:1px solid transparent;background:transparent;border-radius:6px;width:30px;height:26px;font-size:18px;line-height:1;color:var(--muted);padding:0}
.dots:hover{background:#eef0ec;border-color:var(--line);color:var(--ink)}
.addrow{display:flex}
.addrow .add{flex:1}
.mini textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;width:100%;resize:vertical;min-height:32px}
.mini textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px rgba(47,107,85,.15)}
#imenu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;min-width:210px}
#imenu[hidden]{display:none}
#imenu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:7px;font-size:13.5px}
#imenu button:hover,#imenu button:focus-visible{background:#eef2ee;outline:none}
#imenu .perigo{color:var(--late)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,28,24,.42);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;padding:16px;gap:10px}
.mbox h3{margin:0;font-size:16px}
#mbody{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#mbody p{margin:0;color:#3c4541}
.mdica{font-size:13px;color:var(--muted)!important}
.mbtns{display:flex;justify-content:flex-end;gap:8px}
.btn.perigo{background:var(--late);border-color:var(--late);color:#fff}
.btn.perigo:hover{background:#a51f1f}
.mbusca,.mcampo input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
.mcampo{display:flex;flex-direction:column;gap:3px}
.mcampo span{font-size:12px;color:var(--muted);font-weight:550}
.mcampo input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px rgba(47,107,85,.15)}
.mconf{flex:1;font-size:13px;padding:6px 4px}
.mrow .btn.small{margin-left:0}
.mrow.sel .mopt{background:#e6efe9;border-color:#bcd3c5}
.mbusca:focus{border-color:var(--acc);outline:none}
.mlista{display:flex;flex-direction:column;gap:2px;overflow:auto}
.mg{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 4px 2px}
.mopt{border:1px solid transparent;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:8px;align-items:baseline;width:100%}
.mopt:hover,.mopt:focus-visible{background:#eef4f0;border-color:#cfe0d5;outline:none}
.mopt b{flex:1;min-width:0}
.mopt span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.mopt.novo{color:var(--acc)} .mopt.branco{color:var(--muted)}
.mrow{display:flex;align-items:center;gap:4px}
.mrow[hidden],.mopt[hidden],.mgrupo[hidden]{display:none}
.mx{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:16px;flex:none}
.mx:hover{background:var(--late-bg);color:var(--late)}
.iact{display:flex;align-items:center;gap:4px}
.lnk{border:0;background:transparent;color:var(--acc);font-size:12.5px;font-weight:600;padding:4px 6px;border-radius:6px}
.lnk:hover{background:#eef4f0}
.mini span i{font-style:normal;font-weight:400}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{border:1px solid #c9d6cd;background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--acc)}
.chip:hover{background:#eef4f0}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.box p.none{margin:0;font-size:12.5px;color:var(--muted)}
.rm{border:0;background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:6px;align-self:start}
.rm:hover{background:var(--late-bg);color:var(--late)}
.add{border:1px dashed #b7beb6;background:transparent;border-radius:8px;padding:6px;color:var(--acc);font-weight:600}
.add:hover{background:#eef4f0}
.st{font-size:12.5px;color:var(--muted)}
.st b{font-weight:650}
.st.ok b{color:var(--okc)} .st.soon b,.st.today b{color:var(--warn)} .st.late b{color:var(--late)}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);background:var(--fill);position:relative}
.sw[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.danger{border:1px solid #efc1c1;color:var(--late);background:#fff;border-radius:8px;padding:7px 10px;align-self:flex-start}
.danger:hover{background:var(--late-bg)}
#panel.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:100%;max-width:none;max-height:72vh;border-radius:16px 16px 0 0;
  padding-bottom:env(safe-area-inset-bottom)}
#panel.sheet #phead{cursor:default}
#panel.sheet #phead::before{content:"";position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#d0d5ce}

#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;
  padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:40;transition:.2s;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast.err{background:var(--late)}
#toast button{border:0;background:transparent;color:#9fe0c2;font-weight:700;padding:0}
#toast.err button{color:#fff;text-decoration:underline}
#printhead,#plist{display:none}
#plist h2{font-size:15px;margin:0 0 2px}
#plist .meta{font-size:10.5px;color:#555;margin:0 0 8px}
#plist table{width:100%;border-collapse:collapse;font-size:9.5px;font-variant-numeric:tabular-nums}
#plist th{background:#2f6b55;color:#fff;text-align:left;padding:4px 5px;font-weight:600}
#plist td{padding:3px 5px;border-bottom:1px solid #e2e5e0;vertical-align:top}
#plist tr.g td{border-top:1.5px solid #9aa59d}
#plist td.eqc{font-weight:700}
#plist .late{color:#c22727;font-weight:700} #plist .soon,#plist .today{color:#b45f00;font-weight:700} #plist .miss{color:#b45f00} #plist .ok{color:#2e7d4f}
#plist thead{display:table-header-group} #plist tr{break-inside:avoid}

@media (pointer:coarse){.eq .rz{width:min(24px,40%);height:min(24px,40%)}.edge.r{width:20px;right:-22px}.edge.b{height:20px;bottom:-22px}.edge.c{width:26px;height:26px;right:-26px;bottom:-26px}}
@media (max-width:700px){
  header{padding:8px 12px}
  header .top .status{font-size:11.5px;width:100%;margin-left:0;min-height:1.4em;line-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools .lg{display:none}
  .tools{gap:5px}
  .btn{padding:6px 9px}
  #roomName{font-size:17px}
  #panel.sheet{max-height:62vh}
  .searchbox{flex:1 1 100%} #q{width:100%}
  input,select,textarea{font-size:16px!important}
  #map{padding:16px 30px 30px 16px}
  .bar{padding:6px 12px}
  .tabs{flex-basis:100%}
  .cal3{grid-template-columns:1fr 1fr}
  .tab{max-width:70vw}
  .tab .nm{overflow:hidden;text-overflow:ellipsis}
  .bar .lg{display:none}
  .sizectl{width:100%;flex-wrap:nowrap}
  .sb{width:32px;height:32px}
  .btn.small{margin-left:auto}
  .hint{display:none}
  header{gap:4px}
  .sizectl .lbl{margin-left:0}
  .hint{padding:6px 12px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{height:auto;overflow:visible;background:#fff;display:block;padding:0}
  header,.bar,.hint,#panel,#toast,.edge,.rz,#ghost,#hover,#sizeTag,.empty{display:none!important}
  #plist{display:block;break-before:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-size:12px}
  #printhead h1{font-size:16px;margin:0}
  #map{overflow:visible;padding:0}
  #room{margin:0;box-shadow:none}
  .eq,.w,.flag,#room{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .eq{box-shadow:none!important;opacity:1!important}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <input id="roomName" aria-label="Nome da sala" title="Nome da sala (toque para renomear)" maxlength="80" spellcheck="false">
    <div class="summary" id="summary"></div>
    <span class="status" id="status"></span>
  </div>
  <div class="tools">
    <div class="searchbox">
      <input id="q" type="search" placeholder="Buscar código, item, data ou “vencido”" aria-label="Buscar" autocomplete="off">
      <button id="qclear" title="Limpar busca" aria-label="Limpar busca" hidden>×</button>
    </div>
    <span id="qcount"></span>
    <button class="btn" id="bUndo" title="Desfazer (Ctrl+Z)" disabled>↶ Desfazer</button>
    <button class="btn" id="bSave" title="Baixar um arquivo .json com todo o cadastro">Salvar<span class="lg"> cópia</span></button>
    <button class="btn" id="bOpen" title="Abrir um arquivo .json salvo antes">Abrir<span class="lg"> cópia</span></button>
    <button class="btn" id="bPrint" title="Imprimir o mapa desta sala e a lista de equipamentos">Imprimir</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>
<nav class="bar" aria-label="Salas">
  <div class="tabs" id="tabs"></div>
  <div class="sizectl">

    <span class="lbl">Lin<span class="lg">has</span></span><button class="sb" data-size="r-" aria-label="Remover uma linha" title="Remover a última linha">−</button><output id="nRows"></output><button class="sb" data-size="r+" aria-label="Adicionar uma linha" title="Adicionar uma linha">+</button>

<script>
'use strict';
/* ====== Configuração ====== */
const KEY = 'sala-dispositivos.v1';
const MAX = 60, UNDO_MAX = 100, AVISO_DIAS = 30;
const COLORS = [
  {id:'cinza',   nome:'Cinza',   fill:'#f3f4f2', bd:'#b3bab4'},
  {id:'azul',    nome:'Azul',    fill:'#dbe9fb', bd:'#7aa3d4'},
  {id:'verde',   nome:'Verde',   fill:'#dbf0e1', bd:'#73b588'},
  {id:'amarelo', nome:'Amarelo', fill:'#fbf0c4', bd:'#cfb24a'},
  {id:'roxo',    nome:'Roxo',    fill:'#ebe1f8', bd:'#a487cf'},
  {id:'rosa',    nome:'Rosa',    fill:'#f9dfea', bd:'#d088a5'},
];
const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];

const $ = s => document.querySelector(s);
const mapEl = $('#map'), room = $('#room'), layer = $('#eqs'), ghost = $('#ghost'), hoverEl = $('#hover');
const panel = $('#panel'), pbody = $('#pbody'), qEl = $('#q');
const coarse = matchMedia('(pointer:coarse)').matches;
const narrowMQ = matchMedia('(max-width:700px)');

let S, novo = null, openId = null, gesture = null, frozenS = 0, printS = 0, curS = 40, query = '';
const undoStack = []; let lastKey = null;

/* ====== Utilidades ====== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const R = () => S.salas.find(x => x.id === S.atual) || S.salas[0];
const find = id => R().equipamentos.find(e => e.id === id);
const overlap = (o, x, y, w, h) => x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h;

/* ====== Datas e calibração ====== */
const leap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const daysIn = (y, m) => [31, leap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return null;
  const o = {y:+m[1], m:+m[2], d:+m[3]};
  return (o.m >= 1 && o.m <= 12 && o.d >= 1 && o.d <= daysIn(o.y, o.m)) ? o : null;
}
// Vencimento = data de calibração + 365 dias por ano de validade.
function vencimento(cal, anos) {
  const p = parseISO(cal); if (!p) return null;
  const n = [1,2,3].includes(+anos) ? +anos : 1;
  const t = new Date(Date.UTC(p.y, p.m - 1, p.d) + n * 365 * 864e5);
  return {y:t.getUTCFullYear(), m:t.getUTCMonth() + 1, d:t.getUTCDate()};
}
const dnum = o => Date.UTC(o.y, o.m - 1, o.d) / 864e5;
function hoje() { const t = new Date(); return {y:t.getFullYear(), m:t.getMonth() + 1, d:t.getDate()}; }
function situacao(cal, anos) {
  const v = vencimento(cal, anos); if (!v) return null;
  const n = Math.round(dnum(v) - dnum(hoje()));
  return {n, v, k: n > AVISO_DIAS ? 'ok' : n > 0 ? 'soon' : n === 0 ? 'today' : 'late'};
}
const p2 = n => String(n).padStart(2, '0');
const fmt = o => `${p2(o.d)}/${p2(o.m)}/${o.y}`;
const fmtCurto = o => `${p2(o.d)}/${p2(o.m)}`;
function textoPainel(s) {
  if (s.k === 'ok') return 'Em dia';
  if (s.k === 'soon') return s.n === 1 ? 'Falta 1 dia' : `Faltam ${s.n} dias`;
  if (s.k === 'today') return 'Vence hoje';
  return -s.n === 1 ? 'Vencido há 1 dia' : `Vencido há ${-s.n} dias`;
}
function textoMapa(s) { return s.k === 'soon' ? `Vence ${fmtCurto(s.v)}` : s.k === 'today' ? 'Vence hoje' : 'Vencido'; }

const MEMORIA_PADRAO = ['Relógio comparador', 'P/NP', 'Controle de temperatura'];
const nomeItem = i => [i.codigo, i.descricao].filter(Boolean).join(' – ') || 'Item sem código';
const validId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(v);
function todosItens(eq) {
  return [
    ...(eq.calibravel ? [{label:'Equipamento', cal:eq.calibracao, val:eq.validade}] : []),
    ...eq.itens.map(i => ({label:nomeItem(i), cal:i.calibracao, val:i.validade})),
  ];
}
function avisos(eq) {
  return todosItens(eq).map(i => ({label:i.label, s:situacao(i.cal, i.val)}))
    .filter(a => a.s && a.s.k !== 'ok').sort((a, b) => a.s.n - b.s.n);
}

/* ====== Dados: carregar, validar, converter ====== */
function novaSala(nome) { return {id: uid(), nome, cols:16, rows:10, equipamentos:[]}; }
function blank() { const s = novaSala('Sala de dispositivos'); return {versao:4, salas:[s], atual:s.id, memoria:[]}; }
function str(v) { return v == null ? '' : (typeof v === 'object' ? '' : String(v)).trim(); }
function int(v, def) { if (v == null || v === '' || typeof v === 'boolean') return def; const n = Number(v); return Number.isFinite(n) ? Math.round(n) : def; }
function isoDe(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) { const iso = `${m[1]}-${m[2]}-${m[3]}`; return parseISO(iso) ? iso : ''; }
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if (m) { const iso = `${m[3]}-${p2(m[2])}-${p2(m[1])}`; return parseISO(iso) ? iso : ''; }
  return '';
}
const validadeDe = v => { const n = int(v, 1); return [1,2,3].includes(n) ? n : 1; };
function lista(v) { if (Array.isArray(v)) return v; if (v == null || v === '') return []; return [v]; }
const pick = (o, ...ks) => { for (const k of ks) if (o[k] != null && o[k] !== '') return o[k]; return undefined; };

function normalize(d) {
  if (!d || typeof d !== 'object') throw new Error('O arquivo não contém dados da sala.');
  const ids = new Set();
  let salas;
  if (!Array.isArray(d) && Array.isArray(d.salas)) {
    if (!d.salas.length) throw new Error('O arquivo não tem nenhuma sala.');
    salas = d.salas.map((x, i) => {
      if (!x || typeof x !== 'object' || Array.isArray(x)) throw new Error(`A sala ${i + 1} do arquivo não é válida.`);
      return normalizeSala(x, ids);
    });
  } else salas = [normalizeSala(d, ids)];
  const sids = new Set();
  for (const x of salas) { if (!validId(x.id) || sids.has(x.id)) x.id = uid(); sids.add(x.id); }
  // Memória de itens: o que já foi digitado, para adicionar mais rápido depois.
  const mem = new Map();
  for (const m of lista(d.memoria)) {
    const desc = str(m && typeof m === 'object' ? m.descricao : m); if (!desc) continue;
    mem.set(norm(desc), {descricao: desc, validade: validadeDe(m && m.validade), usos: Math.max(0, int(m && m.usos, 0))});
  }
  for (const x of salas) for (const eq of x.equipamentos) for (const i of eq.itens) if (i.descricao && !mem.has(norm(i.descricao)))
    mem.set(norm(i.descricao), {descricao: i.descricao, validade: i.validade, usos: 1});
  return {versao:4, salas, atual: salas.some(x => x.id === d.atual) ? d.atual : salas[0].id, memoria: [...mem.values()]};
}
function normalizeSala(d, ids) {
  let list, sala = {};
  if (Array.isArray(d)) list = d;
  else {
    list = pick(d, 'equipamentos', 'equipments', 'dispositivos', 'itens', 'items');
    sala = (d.sala && typeof d.sala === 'object') ? d.sala : (d.room && typeof d.room === 'object' ? d.room : d);
    if (list === undefined && Array.isArray(sala.equipamentos)) list = sala.equipamentos;
    if (list === undefined && (d.sala || d.versao || d.nome || d.cols)) list = [];
  }
  if (!Array.isArray(list)) throw new Error('O arquivo não tem a lista de equipamentos.');
  let cols = clamp(int(pick(sala, 'cols', 'colunas', 'largura'), 16), 2, MAX);
  let rows = clamp(int(pick(sala, 'rows', 'linhas', 'altura'), 10), 2, MAX);
  const out = {id: str(d.id), nome: str(pick(sala, 'nome', 'name') ?? d.nome) || 'Sala de dispositivos', cols, rows, equipamentos:[]};
  const novoId = v => { let id = str(v); if (!validId(id) || ids.has(id)) id = uid(); ids.add(id); return id; };

  const eqs = list.map((raw, i) => {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error(`O item ${i + 1} da lista não é um equipamento válido.`);
    const notas = [str(pick(raw, 'anotacao', 'anotação', 'observacao', 'observação', 'obs', 'notas', 'nota'))].filter(Boolean);
    const cal = isoDe(pick(raw, 'calibracao', 'dataCalibracao', 'ultimaCalibracao', 'data_calibracao'));
    const prox = isoDe(pick(raw, 'proximaCalibracao', 'proxima_calibracao', 'dataProximaCalibracao', 'vencimento'));
    if (prox && !cal) notas.push(`Próxima calibração (versão anterior): ${fmt(parseISO(prox))}`);
    const item = (r, tipoPadrao, especKeys) => {
      if (typeof r !== 'object' || r === null) r = {codigo: r};
      const c = isoDe(pick(r, 'calibracao', 'dataCalibracao', 'ultimaCalibracao'));
      const px = isoDe(pick(r, 'proximaCalibracao', 'proxima_calibracao', 'vencimento'));
      const desc = str(pick(r, 'descricao', 'descrição', 'description')), tipo = str(pick(r, 'tipo', 'type')) || tipoPadrao;
      const it = {id: validId(r.id) ? r.id : uid(), codigo: str(pick(r, 'codigo', 'código', 'code', 'nome')),
        descricao: desc || tipo, calibracao: c, validade: validadeDe(r.validade),
        obs: [str(pick(r, 'obs', 'observacao', 'observação')), desc && tipo ? tipo : '', str(pick(r, ...especKeys))].filter(Boolean).join(' · ')};
      if (px && !c) notas.push(`${nomeItem(it)}: próxima calibração (versão anterior) ${fmt(parseISO(px))}`);
      return it;
    };
    const itens = [
      ...lista(pick(raw, 'itens', 'items')).map(r => item(r, '', ['espec', 'especificacao', 'especificação', 'resolucao', 'medida'])),
      ...lista(pick(raw, 'relogios', 'relógios', 'relogiosComparadores', 'relogio', 'relógio')).map(r => item(r, 'Relógio comparador', ['espec', 'resolucao', 'resolução'])),
      ...lista(pick(raw, 'pnps', 'pnp', 'PNP', 'p_np', 'pNp')).map(r => item(r, 'P/NP', ['espec', 'medida'])),
    ];
    const cor = COLORS.some(c => c.id === raw.cor) ? raw.cor : 'cinza';
    const x = int(pick(raw, 'x', 'col', 'coluna'), null), y = int(pick(raw, 'y', 'row', 'linha'), null);
    const w = clamp(int(pick(raw, 'w', 'largura', 'width'), 1), 1, MAX), h = clamp(int(pick(raw, 'h', 'altura', 'height'), 1), 1, MAX);
    return {
      id: novoId(raw.id), codigo: str(pick(raw, 'codigo', 'código', 'codigoEquipamento', 'code', 'tag')),
      descricao: str(pick(raw, 'descricao', 'descrição', 'description', 'nome')),
      calibracao: cal, validade: validadeDe(raw.validade), anotacao: notas.join('\n'), cor,
      calibravel: raw.calibravel !== false, x, y, w, h, itens,
    };
  });
  // Garante que a sala comporta as posições existentes.
  for (const e of eqs) if (e.x != null && e.y != null && e.x >= 0 && e.y >= 0) {
    cols = Math.max(cols, Math.min(MAX, e.x + e.w)); rows = Math.max(rows, Math.min(MAX, e.y + e.h));
  }
  const placed = [];
  const fits = (x, y, w, h) => x >= 0 && y >= 0 && x + w <= cols && y + h <= rows && !placed.some(o => overlap(o, x, y, w, h));
  const pend = [];
  for (const e of eqs) {
    if (e.x != null && e.y != null && fits(e.x, e.y, e.w, e.h)) placed.push(e); else pend.push(e);
  }
  for (const e of pend) {
    let ok = false;
    for (let tent = 0; tent < 2 && !ok; tent++) {
      if (tent === 1) { e.w = 1; e.h = 1; }
      while (!ok) {
        for (let y = 0; y < rows && !ok; y++) for (let x = 0; x < cols && !ok; x++) if (fits(x, y, e.w, e.h)) { e.x = x; e.y = y; ok = true; }
        if (ok || rows >= MAX) break;
        rows++;
      }
    }
    if (!ok) throw new Error('Os equipamentos do arquivo não cabem em uma sala de 60 × 60.');
    placed.push(e);
  }
  out.cols = cols; out.rows = rows; out.equipamentos = eqs;
  return out;
}

function load() {
  let t = null;
  try { t = localStorage.getItem(KEY); } catch (e) { return blank(); }
  if (!t) return blank();
  try { return normalize(JSON.parse(t)); }
  catch (e) { try { localStorage.setItem(KEY + '.corrompido', t); } catch (_) {} return blank(); }
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; }
}
function save() {
  const ok = saveLocal();
  if (sync.db) { agendarSync(); return; }
  if (ok) { const d = new Date(); setStatus(`Salvo no navegador às ${p2(d.getHours())}:${p2(d.getMinutes())}`); }
  else setStatus('Não foi possível salvar no navegador. Salve uma cópia.', true);
}
function setStatus(t, err) { const s = $('#status'); s.textContent = t; s.className = 'status' + (err ? ' err' : ''); }

/* ====== Desfazer ====== */
function snap(key) {
  if (key && key === lastKey) return;
  pushRaw(JSON.stringify(S)); lastKey = key || null;
}
function pushRaw(str) { undoStack.push(str); if (undoStack.length > UNDO_MAX) undoStack.shift(); lastKey = null; updUndo(); }
function undo() {
  if (!undoStack.length) return;
  S = JSON.parse(undoStack.pop()); lastKey = null;
  save(); render(); refreshPanel(); updUndo();
  toast('Alteração desfeita');
}
function updUndo() { $('#bUndo').disabled = !undoStack.length; }
function changed() { save(); render(); }

/* ====== Desenho do mapa ====== */
function cellSize() {
  if (printS) return printS;
  if (frozenS) return frozenS;
  const W = mapEl.clientWidth - 70, H = mapEl.clientHeight - 70;
  const s = Math.floor(Math.min(W / R().cols, H / R().rows));
  return clamp(s, coarse ? 36 : 30, 64);
}
function matchEq(eq, q) {
  if (/^vencid/.test(q)) return todosItens(eq).some(i => { const s = situacao(i.cal, i.val); return s && s.k === 'late'; });
  if (q === 'a vencer' || q === 'vencer' || q === 'vence hoje') return todosItens(eq).some(i => { const s = situacao(i.cal, i.val); return s && (s.k === 'soon' || s.k === 'today'); });
  if (q === 'sem data') return todosItens(eq).some(i => !parseISO(i.cal));
  const hay = [eq.codigo, eq.descricao, eq.anotacao];
  const data = (c, v) => { const ve = vencimento(c, v); if (ve) hay.push(fmt(ve)); };
  if (eq.calibravel) data(eq.calibracao, eq.validade);
  for (const i of eq.itens) { hay.push(i.codigo, i.descricao, i.obs); data(i.calibracao, i.validade); }
  return norm(hay.join(' \n ')).includes(q);
}
function render() {
  const s = cellSize(); curS = s;
  const {cols, rows} = R();
  room.style.width = cols * s + 'px'; room.style.height = rows * s + 'px';
  room.style.backgroundSize = `${s}px ${s}px`;
  const q = norm(query); let hits = 0;
  layer.innerHTML = R().equipamentos.map(eq => {
    const c = colorOf(eq.cor), av = avisos(eq), top = av[0];
    const lines = Math.max(1, Math.floor((eq.h * s - 4 - 9) / 15));
    const parts = [`<div class="l code">${eq.codigo ? esc(eq.codigo) : '<span class="none">sem código</span>'}</div>`];
    let left = lines - 1, flag = '';
    if (top) { if (left > 0) { parts.push(`<div class="l"><span class="w ${top.s.k}">${esc(textoMapa(top.s))}</span></div>`); left--; } else flag = `<span class="flag ${top.s.k}"></span>`; }
    if (eq.descricao && left > 0) { parts.push(`<div class="l desc">${esc(eq.descricao)}</div>`); left--; }
    const its = eq.itens.map(nomeItem);
    if (its.length && left > 0) {
      if (its.length <= left) its.forEach(t => parts.push(`<div class="l it">${esc(t)}</div>`));
      else {
        its.slice(0, left - 1).forEach(t => parts.push(`<div class="l it">${esc(t)}</div>`));
        const rest = its.length - (left - 1);
        parts.push(`<div class="l more">${left - 1 ? '+' : ''}${rest} ${rest === 1 ? 'item' : 'itens'}</div>`);
      }
    }
    const tip = [[eq.codigo || 'Sem código', eq.descricao].filter(Boolean).join(' — '),
      ...av.map(a => `${a.label}: ${textoPainel(a.s)} (${fmt(a.s.v)})`)].join('\n');
    let cls = 'eq';
    if (q) { if (matchEq(eq, q)) { cls += ' hit'; hits++; } else cls += ' dim'; }
    if (eq.id === openId) cls += ' sel';
    return `<div class="${cls}" data-id="${esc(eq.id)}" tabindex="0" title="${esc(tip)}" style="left:${eq.x * s + 2}px;top:${eq.y * s + 2}px;width:${eq.w * s - 4}px;height:${eq.h * s - 4}px;--fill:${c.fill};--bd:${c.bd}">${parts.join('')}${flag}<span class="rz" data-rz title="Arraste para mudar o tamanho"></span></div>`;
  }).join('') + (R().equipamentos.length ? '' : `<div class="empty">${coarse ? 'Toque em um espaço vazio para criar o primeiro equipamento.<br>Depois: toque para editar, segure e arraste para mover.' : 'Clique em um espaço vazio para criar o primeiro equipamento.'}</div>`);
  const qc = $('#qcount');
  qc.textContent = q ? (hits === 0 ? 'Nada encontrado' : hits === 1 ? '1 encontrado' : `${hits} encontrados`) : '';
  $('#qclear').hidden = !query;
  if (document.activeElement !== $('#roomName')) $('#roomName').value = R().nome;
  document.title = (R().nome || 'Sala') + ' · Sala de Dispositivos';
  resumo(); renderTabs();
}
function estadoSala(sala, q) {
  let late = 0, soon = 0, hits = 0;
  for (const eq of sala.equipamentos) {
    for (const i of todosItens(eq)) { const s = situacao(i.cal, i.val); if (s && s.k === 'late') late++; else if (s && s.k !== 'ok') soon++; }
    if (q && matchEq(eq, q)) hits++;
  }
  return {late, soon, hits};
}
function renderTabs() {
  const q = norm(query), atual = R();
  $('#tabs').innerHTML = S.salas.map(x => {
    const e = estadoSala(x, q), sel = x.id === atual.id;
    const dot = e.late ? '<span class="dot late" title="Tem item vencido"></span>' : e.soon ? '<span class="dot soon" title="Tem item a vencer"></span>' : '';
    const n = q ? `<span class="n hitn" title="Encontrados nesta sala">${e.hits}</span>` : `<span class="n" title="Equipamentos">${x.equipamentos.length}</span>`;
    return `<button class="tab" role="tab" data-sala="${esc(x.id)}" aria-selected="${sel}">${dot}<span class="nm">${esc(x.nome || 'Sem nome')}</span>${n}</button>`;
  }).join('') + '<button class="tab add" id="bNovaSala" title="Criar outra sala ou setor">+ Nova sala</button>';

  const occC = Math.max(0, ...atual.equipamentos.map(o => o.x + o.w)), occR = Math.max(0, ...atual.equipamentos.map(o => o.y + o.h));

  if (!hits.length) return {ok:true};

function eqPress(e, id, el) {

  const before = JSON.stringify(S);
  let state = 'press', hold = null, res = null, nx = eq.x, ny = eq.y, moved = false;

function lugarLivre(sala, w, h, perto) {
  const livre = (x, y) => x >= 0 && y >= 0 && x + w <= sala.cols && y + h <= sala.rows && !sala.equipamentos.some(o => overlap(o, x, y, w, h));
  if (perto) for (const [x, y] of [[perto.x + perto.w, perto.y], [perto.x, perto.y + perto.h], [perto.x - w, perto.y], [perto.x, perto.y - h]]) if (livre(x, y)) return {x, y};
  for (let y = 0; y < sala.rows; y++) for (let x = 0; x < sala.cols; x++) if (livre(x, y)) return {x, y};
  return null;
}
function duplicarEquipamento(eq) {
  const pos = lugarLivre(R(), eq.w, eq.h, eq) || lugarLivre(R(), 1, 1, eq);
  if (!pos) return toast('Não há espaço livre na sala. Adicione uma linha ou coluna.', {error:true});
  snap();
  const w = lugarLivre(R(), eq.w, eq.h, eq) ? eq.w : 1, h = w === eq.w ? eq.h : 1;
  const c = {...eq, id: uid(), codigo: proximoCodigo(eq.codigo), calibracao:'', x:pos.x, y:pos.y, w, h,
    itens: eq.itens.map(i => ({...i, id: uid(), calibracao:''}))};
  R().equipamentos.push(c);
  closePanel(); changed(); openPanel(c.id);
  toast('Cópia criada com os mesmos itens. Informe as datas de calibração.', {label:'Desfazer', action:undo});
}
function moverPara(eq, salaId) {
  const dest = S.salas.find(x => x.id === salaId); if (!dest || dest.id === S.atual) return;
  const livre = (x, y, w, h) => x + w <= dest.cols && y + h <= dest.rows && !dest.equipamentos.some(o => overlap(o, x, y, w, h));
  let pos = null;
  for (const [w, h] of [[eq.w, eq.h], [1, 1]]) {
    for (let y = 0; y < dest.rows && !pos; y++) for (let x = 0; x < dest.cols && !pos; x++) if (livre(x, y, w, h)) pos = {x, y, w, h};
    if (pos) break;
  }
  snap();
  if (!pos) {
    if (dest.rows >= MAX) { undoStack.pop(); updUndo(); refreshPanel(); return toast(`A sala ${dest.nome} está cheia.`, {error:true}); }
    pos = {x:0, y:dest.rows, w:Math.min(eq.w, dest.cols), h:1}; dest.rows++;
  }
  novo = null;
  R().equipamentos = R().equipamentos.filter(o => o.id !== eq.id);
  Object.assign(eq, pos); dest.equipamentos.push(eq);
  closePanel(); changed();
  toast(`${eq.codigo || 'Equipamento'} foi para a sala ${dest.nome}.`, {label:'Desfazer', action:undo});
}
function novoItem(eq, descricao, validade, codigo) {
  snap();
  const it = {id: uid(), codigo: codigo || '', descricao: descricao || '', calibracao:'', validade: validadeDe(validade), obs:''};
  eq.itens.push(it);
  if (descricao) lembrar(descricao, validade, true);
  changed(); refreshPanel();
  const campo = !it.codigo ? 'codigo' : !it.descricao ? 'descricao' : 'calibracao';
  const inp = pbody.querySelector(`[data-iid="${CSS.escape(it.id)}"] [data-if="${campo}"]`);
  if (inp) { inp.focus(); inp.scrollIntoView({block:'nearest'}); }
}

function moverItem(eq, it) {
  const opcoes = [];
  for (const x of S.salas) for (const e of x.equipamentos) if (e.id !== eq.id) opcoes.push({sala:x, eq:e});
  if (!opcoes.length) return toast('Não há outra máquina cadastrada para receber o item.', {error:true});
  escolherEquipamento(`Mover “${nomeItem(it)}”`, opcoes).then(dest => {
    if (!dest) return;
    const orig = S.salas.flatMap(x => x.equipamentos).find(e => e.id === eq.id);
    const alvo = S.salas.flatMap(x => x.equipamentos).find(e => e.id === dest);
    if (!orig || !alvo || !orig.itens.includes(it)) return;
    snap();
    orig.itens = orig.itens.filter(i => i !== it); alvo.itens.push(it);
    changed(); refreshPanel();
    toast(`${nomeItem(it)} foi para ${alvo.codigo || 'o equipamento escolhido'}.`, {label:'Desfazer', action:undo});

function linhasLista(sala) {
  const eqs = [...sala.equipamentos].sort((a, b) => (a.codigo || '\uffff').localeCompare(b.codigo || '\uffff', 'pt-BR', {numeric:true}) || a.y - b.y || a.x - b.x);
  const out = [];
  for (const eq of eqs) {
    const its = [...(eq.calibravel ? [{codigo:'', descricao:'Próprio equipamento', obs:'', calibracao:eq.calibracao, validade:eq.validade}] : []), ...eq.itens];
    if (!its.length) its.push(null);
    its.forEach((i, n) => {
      const s = i && situacao(i.calibracao, i.validade);
      out.push({first: n === 0, eq: eq.codigo || '(sem código)', desc: n === 0 ? eq.descricao : '',
        icod: i ? i.codigo : '', idesc: i ? i.descricao : 'Sem itens calibráveis', obs: i ? i.obs : '',
        cal: i && parseISO(i.calibracao) ? fmt(parseISO(i.calibracao)) : (i ? '—' : ''), val: i ? `${i.validade} ${i.validade === 1 ? 'ano' : 'anos'}` : '',
        venc: s ? fmt(s.v) : (i ? '—' : ''), sit: s ? textoPainel(s) : (i ? 'Sem data' : ''), k: s ? s.k : (i ? 'miss' : '')});
    });
  }
  return out;
}
function resumoLista(sala) {
  const e = estadoSala(sala, ''), nItens = sala.equipamentos.reduce((a, eq) => a + todosItens(eq).length, 0);
  let miss = 0; for (const eq of sala.equipamentos) for (const i of todosItens(eq)) if (!parseISO(i.cal)) miss++;
  const n = sala.equipamentos.length;
  return `${n} ${n === 1 ? 'equipamento' : 'equipamentos'} · ${nItens} ${nItens === 1 ? 'item calibrável' : 'itens calibráveis'} · ${e.late} ${e.late === 1 ? 'vencido' : 'vencidos'} · ${e.soon} a vencer em ${AVISO_DIAS} dias · ${miss} sem data`;
}
const COLS_LISTA = ['Equipamento', 'Descrição', 'Código do item', 'Descrição do item', 'Observação', 'Calibração', 'Validade', 'Vencimento', 'Situação'];
function montarListaImpressao() {
  const sala = R();
  $('#plist').innerHTML = `<h2>Lista de equipamentos · ${esc(sala.nome)}</h2><p class="meta">Impresso em ${fmt(hoje())} · ${esc(resumoLista(sala))}</p>
    <table><thead><tr>${COLS_LISTA.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${linhasLista(sala).map(r => `<tr class="${r.first ? 'g' : ''}">
      <td class="eqc">${r.first ? esc(r.eq) : ''}</td><td>${esc(r.desc)}</td><td>${esc(r.icod)}</td><td>${esc(r.idesc)}</td><td>${esc(r.obs)}</td>
      <td>${r.cal}</td><td>${r.val}</td><td>${r.venc}</td><td class="${r.k}">${esc(r.sit)}</td></tr>`).join('')}</tbody></table>`;
}
function preparePrint() {
  montarListaImpressao();
  const {cols, rows} = R();
  printS = clamp(Math.floor(Math.min(1030 / cols, 640 / rows)), 8, 64);
  $('#phName').textContent = R().nome;
  $('#phInfo').textContent = `Impresso em ${fmt(hoje())} · Laranja: vence em até ${AVISO_DIAS} dias · Vermelho: vencido`;
  render();
}
function endPrint() { if (!printS) return; printS = 0; render(); }
addEventListener('beforeprint', preparePrint);
addEventListener('afterprint', endPrint);
matchMedia('print').addEventListener?.('change', e => e.matches ? preparePrint() : endPrint());
$('#bPrint').addEventListener('click', () => { closePanel(); if (noClaude) gerarPDF(); else window.print(); });

/* ====== PDF (usado no claude.ai, onde a página não pode abrir a impressão) ====== */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let jspdfP = null;
function carregarJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return jspdfP = jspdfP || new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = JSPDF_URL;
    sc.onload = () => window.jspdf ? ok(window.jspdf) : fail(new Error('jsPDF'));
    sc.onerror = () => { jspdfP = null; fail(new Error('jsPDF')); };
    document.head.appendChild(sc);
  });
}
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function cortar(doc, t, maxW) {
  t = String(t || ''); if (doc.getTextWidth(t) <= maxW) return t;
  while (t.length > 1 && doc.getTextWidth(t + '…') > maxW) t = t.slice(0, -1);
  return t + '…';
}
function pdfDoc(jspdf) {
  const doc = new jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const sala = R(), W = 297, H = 210, M = 10;
  // Página 1: mapa
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(29, 36, 33); doc.text(sala.nome || 'Sala', M, M + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(90, 100, 95);
  doc.text(`Impresso em ${fmt(hoje())} · Laranja: vence em até ${AVISO_DIAS} dias · Vermelho: vencido`, W - M, M + 5, {align:'right'});
  const top = M + 10, c = Math.min((W - 2 * M) / sala.cols, (H - top - M) / sala.rows);
  doc.setDrawColor(227, 231, 225); doc.setLineWidth(0.15);
  for (let i = 1; i < sala.cols; i++) doc.line(M + i * c, top, M + i * c, top + sala.rows * c);
  for (let i = 1; i < sala.rows; i++) doc.line(M, top + i * c, M + sala.cols * c, top + i * c);
  doc.setDrawColor(190, 197, 189); doc.setLineWidth(0.3); doc.rect(M, top, sala.cols * c, sala.rows * c);
  const fs = clamp(c * 1.15, 4.5, 9), lh = fs * 0.3528 * 1.3;
  for (const eq of sala.equipamentos) {
    const col = colorOf(eq.cor), x = M + eq.x * c + 0.5, y = top + eq.y * c + 0.5, w = eq.w * c - 1, h = eq.h * c - 1;
    doc.setFillColor(...rgb(col.fill)); doc.setDrawColor(...rgb(col.bd)); doc.setLineWidth(0.35);
    doc.roundedRect(x, y, w, h, 1, 1, 'FD');
    const tw = w - 2, top1 = avisos(eq)[0];
    let ly = y + 1 + lh * 0.8, left = Math.max(1, Math.floor((h - 1.5) / lh));
    const linha = (txt, bold, cor) => { if (left <= 0) return; doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(fs); doc.setTextColor(...cor); doc.text(cortar(doc, txt, tw), x + 1, ly); ly += lh; left--; };
    linha(eq.codigo || 'sem código', true, [29, 36, 33]);
    if (top1) linha(textoMapa(top1.s), true, top1.s.k === 'late' ? [194, 39, 39] : [180, 95, 0]);
    if (eq.descricao) linha(eq.descricao, false, [54, 64, 59]);
    const its = eq.itens.map(nomeItem);
    if (its.length && left > 0) {
      const cabem = its.length <= left ? its.length : left - 1;
      its.slice(0, cabem).forEach(t => linha(t, false, [79, 90, 84]));
      if (cabem < its.length) linha(`+${its.length - cabem} itens`, false, [101, 112, 106]);
    }
  }
  // Páginas seguintes: lista
  doc.addPage();
  const cw = [24, 36, 24, 44, 50, 20, 14, 20, 0]; cw[8] = W - 2 * M - cw.reduce((a, b) => a + b, 0);
  let y = M + 5;
  const cab = cont => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(29, 36, 33);
    doc.text(`Lista de equipamentos · ${sala.nome}${cont ? ' (continuação)' : ''}`, M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(90, 100, 95);
    doc.text(`Impresso em ${fmt(hoje())} · ${resumoLista(sala)}`, M, y + 5);
    y += 9;
    doc.setFillColor(47, 107, 85); doc.rect(M, y, W - 2 * M, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(255, 255, 255);
    let x = M; COLS_LISTA.forEach((t, i) => { doc.text(t, x + 1.2, y + 4.1); x += cw[i]; });
    y += 6;
  };
  cab(false);
  doc.setFontSize(7.5);
  for (const r of linhasLista(sala)) {
    const cells = [r.first ? r.eq : '', r.desc, r.icod, r.idesc, r.obs, r.cal, r.val, r.venc, r.sit];
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
    const wrapped = cells.map((t, i) => doc.splitTextToSize(String(t || ''), cw[i] - 2.4));
    const rh = Math.max(1, ...wrapped.map(l => l.length)) * 3.2 + 1.8;
    if (y + rh > H - M) { doc.addPage(); y = M + 5; cab(true); doc.setFontSize(7.5); }
    if (r.first) { doc.setDrawColor(154, 165, 157); doc.setLineWidth(0.35); doc.line(M, y, W - M, y); }
    let x = M;
    wrapped.forEach((ls, i) => {
      const k = i === 8 ? r.k : '';
      doc.setFont('helvetica', (i === 0 || k === 'late' || k === 'soon' || k === 'today') ? 'bold' : 'normal');
      doc.setTextColor(...(k === 'late' ? [194, 39, 39] : (k === 'soon' || k === 'today' || k === 'miss') ? [180, 95, 0] : k === 'ok' ? [46, 125, 79] : [29, 36, 33]));
      doc.text(ls, x + 1.2, y + 3.6);
      x += cw[i];
    });
    y += rh;
    doc.setDrawColor(226, 229, 224); doc.setLineWidth(0.15); doc.line(M, y, W - M, y);
  }
  const np = doc.getNumberOfPages();
  for (let i = 1; i <= np; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 128, 124); doc.text(`Página ${i} de ${np}`, W - M, H - 4, {align:'right'}); }
  return doc;
}
async function gerarPDF() {
  const b = $('#bPrint'); b.disabled = true; const txt = b.textContent; b.textContent = 'Gerando PDF…';
  try {
    const doc = pdfDoc(await carregarJsPDF());
    const d = new Date(), slug = norm(R().nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sala';
    const nome = `${slug}-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.pdf`;
    const dl = downloadsP ? await downloadsP : null;
    if (dl) {
      await dl.save({filename:nome, data:doc.output('arraybuffer')}).then(
        () => toast('PDF pronto. Abra o arquivo e use Imprimir.'),
        err => { if (err && err.code !== 'declined') toast('Não foi possível salvar o PDF aqui. Tente em um navegador.', {error:true}); });
    } else doc.save(nome);
  } catch (e) {
    toast('Não foi possível gerar o PDF. Verifique a internet e tente de novo.', {error:true});
  } finally { b.disabled = false; b.textContent = txt; }
}

/* ====== Teclado global ====== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalFim) { e.preventDefault(); modalFim(null); return; }
  if (e.key === 'Escape' && !imenu.hidden) { e.preventDefault(); fecharMenuItem(); return; }
  if (modalFim) return;
  if (e.key === 'Escape' && openId) { e.preventDefault(); closePanel(); return; }
  if (e.key === 'Delete' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
    const id = openId || (e.target.closest && e.target.closest('.eq') ? e.target.closest('.eq').dataset.id : null);
    if (id) { e.preventDefault(); pedirExclusaoEquipamento(id); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    if (e.target === qEl) return;
    e.preventDefault(); undo();
  }
});

/* ====== Sincronização entre aparelhos (só no claude.ai) ======
   Cada sala e cada equipamento é um documento: salas/<id>, eqs/<id>; a memória fica em meta/memoria.
   "base" guarda o último estado confirmado com a nuvem. Uma mudança local é o que difere da base;
   uma mudança remota só é aplicada onde este aparelho não tem alteração pendente. */
const sync = {db:null, pronto:false, base:new Map(), remoto:new Map(), carregou:{salas:false, eqs:false, meta:false}, timer:0, escrevendo:false, pendente:false, falhas:0};
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
function paraDocs(st) {
  const m = new Map();
  st.salas.forEach((x, i) => {
    m.set('salas/' + x.id, canon({nome:x.nome, cols:x.cols, rows:x.rows, ordem:i}));
    x.equipamentos.forEach((e, j) => m.set('eqs/' + e.id, canon({...e, sala:x.id, ordem:j})));
  });
  m.set('meta/memoria', canon({itens: st.memoria}));
  return m;
}
function deDocs(m, atual) {
  const salas = [], eqs = [];
  let memoria = [];
  for (const [path, j] of m) {
    const d = JSON.parse(j), id = path.split('/')[1];
    if (path.startsWith('salas/')) salas.push({...d, id, equipamentos:[]});
    else if (path.startsWith('eqs/')) eqs.push({...d, id});
    else if (path === 'meta/memoria') memoria = d.itens || [];
  }
  if (!salas.length) return null;
  salas.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
  eqs.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
  for (const e of eqs) { const x = salas.find(y => y.id === e.sala) || salas[0]; const {sala, ordem, ...resto} = e; x.equipamentos.push(resto); }
  for (const x of salas) delete x.ordem;
  return normalize({salas, memoria, atual});
}
function agendarSync() { clearTimeout(sync.timer); sync.timer = setTimeout(enviar, 600); }
async function enviar() {
  if (!sync.db || !sync.pronto) return;
  if (sync.escrevendo) { sync.pendente = true; return; }
  sync.escrevendo = true; sync.pendente = false;
  const local = paraDocs(S), ops = [];
  for (const [p, j] of local) if (sync.base.get(p) !== j) ops.push([p, j]);
  for (const p of sync.base.keys()) if (!local.has(p)) ops.push([p, null]);
  if (ops.length) setStatus('Salvando…');
  try {
    for (let i = 0; i < ops.length; i += 8) {
      await Promise.all(ops.slice(i, i + 8).map(async ([p, j]) => {
        if (j === null) { await sync.db.doc(p).delete(); sync.base.delete(p); }
        else { await sync.db.doc(p).set(JSON.parse(j)); sync.base.set(p, j); }
      }));
    }
    sync.falhas = 0;
    const d = new Date(); setStatus(`Sincronizado às ${p2(d.getHours())}:${p2(d.getMinutes())}`);
  } catch (e) {
    sync.falhas++;
    if (e && e.code === 'quota_exceeded') setStatus('A nuvem está cheia. Salve uma cópia e apague itens antigos.', true);
    else setStatus('Sem conexão. As alterações estão neste aparelho e serão enviadas.', true);
    clearTimeout(sync.timer); sync.timer = setTimeout(enviar, Math.min(60000, 4000 * sync.falhas));
  } finally {
    sync.escrevendo = false;
    if (sync.pendente) agendarSync();
  }
}
function receber() {
  const c = sync.carregou; if (!(c.salas && c.eqs && c.meta) || sync.recusou) return;
  if (!sync.pronto) { if (!sync.iniciando) { sync.iniciando = true; primeiraCarga().finally(() => { sync.iniciando = false; if (sync.pronto) receber(); }); } return; }
  const local = paraDocs(S);
  let mudou = false, mudouAberto = false;
  for (const p of new Set([...sync.remoto.keys(), ...sync.base.keys()])) {
    const r = sync.remoto.get(p), b = sync.base.get(p);
    if (r === b) continue;
    if (local.get(p) === b) { // sem alteração local pendente: vale o que veio da nuvem
      if (r === undefined) local.delete(p); else local.set(p, r);
      mudou = true; if (openId && p === 'eqs/' + openId) mudouAberto = true;
    }
    if (r === undefined) sync.base.delete(p); else sync.base.set(p, r);
  }
  if (!mudou) return;
  const novoS = deDocs(local, S.atual); if (!novoS) return;
  if (gesture) { setTimeout(receber, 500); return; }
  S = novoS; saveLocal(); render();
  if (openId && !find(openId)) closePanel();
  else if (mudouAberto && !panel.contains(document.activeElement)) refreshPanel();
  else if (openId) updStatus();
  const d = new Date(); setStatus(`Atualizado de outro aparelho às ${p2(d.getHours())}:${p2(d.getMinutes())}`);
}
async function primeiraCarga() {
  const temNuvem = [...sync.remoto.keys()].some(p => p.startsWith('salas/'));
  if (temNuvem) {
    const daNuvem = deDocs(sync.remoto, S.atual);
    const locais = S.salas.reduce((a, x) => a + x.equipamentos.length, 0);
    if (locais && canon([...paraDocs(S)]) !== canon([...paraDocs(daNuvem)])) {
      try { localStorage.setItem(KEY + '.antes-da-sincronizacao', JSON.stringify(S)); } catch (_) {}
    }
    sync.base = new Map(sync.remoto); sync.pronto = true;
    closePanel(); S = daNuvem; saveLocal(); render();
    const d = new Date(); setStatus(`Sincronizado às ${p2(d.getHours())}:${p2(d.getMinutes())}`);
    agendarSync(); // envia ajustes de formato, se houver
    return;
  }
  // Nuvem vazia: este aparelho pode enviar o que tem.
  const nEq = S.salas.reduce((a, x) => a + x.equipamentos.length, 0);
  if (nEq) {
    const ok = await confirmar('Sincronizar este aparelho?',
      `Ainda não há dados na nuvem. Enviar ${S.salas.length === 1 ? 'a sala' : 'as ' + S.salas.length + ' salas'} e os ${nEq} equipamentos deste aparelho? Depois disso, o celular e o computador mostram sempre os mesmos dados.`, 'Enviar e sincronizar');
    if (!ok) { sync.recusou = true; setStatus('Não sincronizado: os dados estão só neste aparelho. Recarregue para tentar de novo.', true); return; }
  }
  sync.base = new Map(); sync.pronto = true;
  enviar();
}
async function iniciarSync() {
  if (!noClaude) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (_) {}
  if (!db) return;
  sync.db = db;
  setStatus('Conectando à nuvem…');
  const aviso = setTimeout(() => { if (!sync.pronto) setStatus('Sem conexão com a nuvem. Usando os dados deste aparelho.', true); }, 10000);
  const ouvir = (col, chave) => db.collection(col).onSnapshot(qs => {
    for (const k of [...sync.remoto.keys()]) if (k.startsWith(col + '/')) sync.remoto.delete(k);
    for (const d of qs.docs) if (d.exists) sync.remoto.set(col + '/' + d.id, canon(d.data()));
    if (!qs.metadata.fromCache) sync.carregou[chave] = true;
    if (sync.carregou.salas && sync.carregou.eqs && sync.carregou.meta) clearTimeout(aviso);
    receber();
  }, err => setStatus('A sincronização parou. Recarregue a página.', true));
  ouvir('salas', 'salas'); ouvir('eqs', 'eqs');
  db.doc('meta/memoria').onSnapshot(d => {
    if (d.exists) sync.remoto.set('meta/memoria', canon(d.data())); else sync.remoto.delete('meta/memoria');
    if (!d.metadata.fromCache) sync.carregou.meta = true;
    receber();
  }, err => setStatus('A sincronização parou. Recarregue a página.', true));
}

/* ====== Avisos ====== */
let toastT;
function toast(msg, o = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (o.action ? `<button>${esc(o.label)}</button>` : '');
  t.className = 'show' + (o.error ? ' err' : '');
  if (o.action) t.querySelector('button').onclick = () => { t.className = ''; o.action(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, o.error ? 9000 : 5000);
}

/* ====== Início ====== */
$('#hint').textContent = coarse
  ? 'Toque em um espaço vazio para criar. Toque em um equipamento para editar. Segure e arraste para mover. Puxe o canto para mudar o tamanho.'
  : 'Clique em um espaço vazio para criar. Clique em um equipamento para editar. Arraste para mover (sobre outro do mesmo tamanho, troca de lugar). Puxe o canto para mudar o tamanho. Puxe a borda da sala para aumentá-la.';
// Dentro do claude.ai não há impressão nem download direto; o download usa o recurso do próprio claude.ai.
const noClaude = !!(window.claude && window.claude.use);
const downloadsP = noClaude ? window.claude.use('downloads').catch(() => null) : null;
S = load();
render();
iniciarSync();
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (gesture) return; render(); if (openId) { const id = openId; layer.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.add('sel'); placePanel(); } }, 120); });
setInterval(() => { if (!gesture) { render(); if (openId) updStatus(); } }, 60 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !gesture) render(); });
